spring.application.name=EnjoyTrip
server.port=3002
spring.config.import=optional:file:../infra/.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/${MYSQL_DATABASE:enjoytrip}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:enjoytrip}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
